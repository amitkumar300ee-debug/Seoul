<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — SeoulWalls</title>
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><img src="images/logo.png" alt="" /> SeoulWalls</a>
    <span class="admin-tag">Admin</span>
  </div>
</nav>

<!-- ---------- Login screen ---------- -->
<div class="container admin-wrap" id="loginScreen">
  <div class="glass login-card">
    <h1>Admin Login</h1>
    <p class="sub">Enter the admin password to manage wallpapers.</p>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
    <button class="btn btn-primary btn-block" id="loginBtn">Login</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<!-- ---------- Dashboard (hidden until logged in) ---------- -->
<div class="container admin-wrap" id="dashboard" style="display:none;">

  <div class="glass upload-card">
    <h2>Upload a wallpaper</h2>
    <div class="drop-zone" id="dropZone">
      <div id="dropZoneEmpty">
        <span class="drop-ico">⬆</span>
        <p><strong>Click to choose</strong> or drag &amp; drop an image</p>
        <span class="drop-hint">JPG, PNG or WEBP</span>
      </div>
      <img id="previewImg" style="display:none;" />
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden />

    <div class="form-row">
      <label>Title
        <input type="text" id="titleInput" placeholder="e.g. Neon Seoul Night" />
      </label>
      <label>Category
        <input type="text" id="categoryInput" list="categoryList" placeholder="e.g. Night City" />
        <datalist id="categoryList"></datalist>
      </label>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="isAiInput" /> AI-generated wallpaper
    </label>

    <button class="btn btn-primary btn-block" id="uploadBtn">Upload Wallpaper</button>
    <p class="upload-status" id="uploadStatus"></p>
  </div>

  <div class="section-head" style="margin-top:50px;">
    <h2>Uploaded wallpapers</h2>
    <span id="countLabel" class="view-all"></span>
  </div>
  <div class="admin-grid" id="adminGrid">
    <div class="skeleton" style="aspect-ratio:9/16"></div>
    <div class="skeleton" style="aspect-ratio:9/16"></div>
    <div class="skeleton" style="aspect-ratio:9/16"></div>
    <div class="skeleton" style="aspect-ratio:9/16"></div>
  </div>
</div>

<footer><div class="container footer-bottom" style="margin-top:0;">© 2026 SeoulWalls. All rights reserved.</div></footer>

<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
