<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wallpapers — SeoulWalls</title>
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/home.css" />
<style>
  .browse-head { padding: 40px 0 24px; }
  .browse-head h1 { font-family: var(--font-display); font-size: 1.9rem; margin-bottom: 6px; }
  .browse-head p { color: var(--txt-dim); }
  .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 24px 0 30px; }
  .tab {
    padding: 9px 18px; border-radius: 999px; border: 1px solid var(--border);
    font-size: 0.85rem; color: var(--txt-dim); background: var(--card);
  }
  .tab.active { background: var(--grad); color: #fff; border-color: transparent; }
  .load-more-wrap { text-align: center; margin: 36px 0 70px; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><img src="images/logo.png" alt="" /> SeoulWalls</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="wallpapers.html" class="active">Wallpapers</a></li>
      <li><a href="wallpapers.html#categories">Categories</a></li>
      <li><a href="index.html#app">Get the App</a></li>
      <li><a href="about.html">About Us</a></li>
    </ul>
    <div class="nav-right">
      <div class="search-box">
        <span>&#128269;</span>
        <input type="text" id="pageSearch" placeholder="Search wallpapers..." />
      </div>
      <a href="index.html#app" class="btn btn-primary">Get the App</a>
    </div>
  </div>
</nav>

<div class="container browse-head">
  <h1>All <span class="grad-text">Wallpapers</span></h1>
  <p id="resultSummary">Loading wallpapers…</p>
  <div class="tabs" id="tabs">
    <span class="tab active" data-cat="">All</span>
  </div>
</div>

<div class="container">
  <div class="wall-grid" id="grid">
    <div class="skeleton" style="aspect-ratio:9/16"></div>
    <div class="skeleton" style="aspect-ratio:9/16"></div>
    <div class="skeleton" style="aspect-ratio:9/16"></div>
    <div class="skeleton" style="aspect-ratio:9/16"></div>
    <div class="skeleton" style="aspect-ratio:9/16"></div>
    <div class="skeleton" style="aspect-ratio:9/16"></div>
  </div>
  <div class="load-more-wrap">
    <button class="btn btn-outline" id="loadMoreBtn" style="display:none;">Load More</button>
  </div>
</div>

<footer>
  <div class="container footer-bottom" style="margin-top:0;">© 2026 SeoulWalls. All rights reserved.</div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/wallpapers.js"></script>
</body>
</html>
