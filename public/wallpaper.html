<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wallpaper — SeoulWalls</title>
<link rel="icon" href="images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/home.css" />
<style>
  .detail-wrap { display: grid; grid-template-columns: 1fr 340px; gap: 40px; padding: 40px 0 80px; }
  .detail-img { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--card); max-height: 80vh; }
  .detail-img img { width: 100%; height: 100%; object-fit: contain; }
  .detail-side h1 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 6px; }
  .detail-side .cat-pill {
    display: inline-block; font-size: 0.78rem; color: var(--pink);
    background: var(--grad-soft); padding: 5px 12px; border-radius: 999px; margin-bottom: 18px;
  }
  .detail-stats { display: flex; gap: 20px; margin: 18px 0 26px; color: var(--txt-dim); font-size: 0.85rem; }
  @media (max-width: 900px) { .detail-wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><img src="images/logo.png" alt="" /> SeoulWalls</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="wallpapers.html">Wallpapers</a></li>
      <li><a href="about.html">About Us</a></li>
    </ul>
    <div class="nav-right"><a href="index.html#app" class="btn btn-primary">Get the App</a></div>
  </div>
</nav>

<div class="container detail-wrap" id="detail">
  <div class="detail-img"><div class="skeleton" style="aspect-ratio:9/16"></div></div>
  <div class="detail-side">
    <div class="skeleton" style="height:28px; width:70%; margin-bottom:14px;"></div>
    <div class="skeleton" style="height:20px; width:40%;"></div>
  </div>
</div>

<footer><div class="container footer-bottom" style="margin-top:0;">© 2026 SeoulWalls. All rights reserved.</div></footer>

<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('detail').innerHTML = '<p>Wallpaper not found.</p>'; return; }
  try {
    const { wallpaper: w } = await api(`/api/wallpapers/${id}`);
    const imgUrl = `${API_BASE}/image/${w.image_key}`;
    document.title = `${w.title} — SeoulWalls`;
    document.getElementById('detail').innerHTML = `
      <div class="detail-img"><img src="${imgUrl}" alt="${escapeHTML(w.title)}" /></div>
      <div class="detail-side">
        <h1>${escapeHTML(w.title)}</h1>
        <span class="cat-pill">${escapeHTML(w.category)}</span>
        <div class="detail-stats">
          <span>❤ ${w.likes || 0} likes</span>
          <span>⬇ ${w.downloads || 0} downloads</span>
        </div>
        <a class="btn btn-primary btn-block" href="${imgUrl}" download="${escapeHTML(w.title)}.jpg" id="dlBtn">⬇ Download Wallpaper</a>
        <a class="btn btn-outline btn-block" style="margin-top:12px;" href="wallpapers.html?category=${encodeURIComponent(w.category)}">More in ${escapeHTML(w.category)}</a>
      </div>`;
    document.getElementById('dlBtn').addEventListener('click', () => {
      fetch(`${API_BASE}/api/wallpapers/${id}/download`, { method: 'POST' }).catch(() => {});
    });
  } catch (e) {
    document.getElementById('detail').innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><span>⚠️</span>Couldn't load this wallpaper.</div>`;
  }
});
</script>
</body>
</html>
